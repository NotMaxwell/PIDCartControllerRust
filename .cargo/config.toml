[target.'cfg(all(target_arch = "arm", target_os = "none"))']
# Flash + run over a debug probe (CMSIS-DAP / picoprobe / Pico's own debug port).
# Swap for `elf2uf2-rs -d` if you'd rather flash over the Pico's USB BOOTSEL drive.
runner = "probe-rs run --chip RP2040"

[build]
target = "thumbv6m-none-eabi"

[env]
DEFMT_LOG = "info"
