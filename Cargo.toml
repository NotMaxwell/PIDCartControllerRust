[package]
name = "pid-cart-controller"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Embassy async firmware for the Engr401 ELT3 Cart-and-Rail PID lab (Raspberry Pi Pico / RP2040)"

[dependencies]
embassy-executor = { version = "0.6", features = ["arch-cortex-m", "executor-thread", "integrated-timers"] }
embassy-rp = { version = "0.2", features = ["time-driver", "critical-section-impl"] }
embassy-time = { version = "0.3" }
cortex-m = { version = "0.7" }
cortex-m-rt = "0.7"
defmt = "0.3"
defmt-rtt = "0.4"
panic-probe = { version = "0.3", features = ["print-defmt"] }
fixed = "1.24"

# Only pulled in for `cargo test --target <host-triple>`, where the crate is
# compiled with std (see `#![cfg_attr(not(test), no_std)]` in src/lib.rs).
[dev-dependencies]

[profile.release]
debug = 2
lto = true
opt-level = "s"
incremental = false
codegen-units = 1

[profile.dev]
debug = 2
lto = true
opt-level = "s"
